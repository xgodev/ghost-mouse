[workspace]
resolver = "2"
members = ["crates/core", "crates/macos", "crates/ghost-mouse"]

[workspace.package]
edition = "2021"
version = "0.1.0"
rust-version = "1.94"
publish = false
repository = "https://github.com/xgodev/ghost-mouse"

[workspace.dependencies]
ghost-mouse-core = { path = "crates/core" }
ghost-mouse-macos = { path = "crates/macos" }
clap = { version = "4.5.20", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3.13.0"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "objc2", "libc", "CGDirectDisplay", "CGEvent", "CGEventSource", "CGEventTypes", "CGGeometry", "CGRemoteOperation", "CGWindow"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSEvent", "NSGraphicsContext", "NSRunningApplication", "objc2-core-graphics"] }
